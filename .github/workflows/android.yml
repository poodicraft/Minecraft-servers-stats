name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Build release APK (unsigned; checks the R8 setup)
        run: ./gradlew --stacktrace assembleRelease

      - name: Inspect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ServerScope-debug.apk
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging ServerScope-debug.apk \
            | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|uses-permission|application-label)"
          ls -l ServerScope-debug.apk app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: ServerScope-debug
          path: ServerScope-debug.apk

      - name: Publish debug APK as a pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" ServerScope-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ServerScope debug build ($GITHUB_REF_NAME)" \
            --notes "Debug APK built by GitHub Actions from ${GITHUB_SHA}. Install it on Android 7.0+ (see README)."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
