name: UI smoke test

# Installs the app on emulators (minSdk 24 and a recent Android), walks through the main
# screens against the real mcstatus.io API and keeps screenshots of each step.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_smoke_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api${{ matrix.api-level }}
          path: screenshots

  publish:
    needs: smoke
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true

      - name: Publish screenshots as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l screenshots
          bash tools/publish_prerelease.sh "smoke-${GITHUB_REF_NAME//\//-}" \
            "UI smoke test screenshots ($GITHUB_REF_NAME)" \
            "Screenshots from the emulator smoke test of ${GITHUB_SHA}." \
            screenshots/*.png screenshots/*.txt
